server:
  port: 8080 # Единый порт для внешнего мира

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      observability:
        enabled: true  # Включает генерацию спанов для маршрутов Gateway
      # Орабатывать OPTIONS запросы до прохождения фильтров
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]': # Применять CORS ко всем маршрутам
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "http://localhost:5173" # Стандартный порт Vite / React
              - "https://*.quickbite.com" # Продакшен домены
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "X-Requested-With"
              - "Accept"
              - "Origin"
            exposedHeaders: # Заголовки, которые JS на фронтенде сможет прочитать из ответа
              - "X-User-Id"
              - "X-User-Role"
            allowCredentials: true # Разрешает передачу авторизационных куков и заголовков Header Bearer
            maxAge: 3600 # Время (в сек), на которое браузер кэширует ответ Preflight (1 час)
      routes:
        # Маршруты для Заказов
        # 1. Маршрут для короткого пути (автоматически добавляет /api/v1)
        - id: order-service-short
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders, /orders/**
          filters:
            - RewritePath=/orders(?<segment>/?.*), /api/v1/orders$\{segment}

        # 2. Маршрут для прямого пути (пробрасывает /api/v1/orders как есть)
        - id: order-service-direct
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders, /api/v1/orders/**

        # Маршрут для Уведомлений
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**

        # Маршрут для Пользователей (если есть контроллеры)
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**, /api/v1/auth/**, /api/v1/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: "B3_MULTI,W3C"
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-},%X{spanId:-}] %m%n"

