spring:
  datasource:
    url: jdbc:h2:mem:analytics_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers} # Используем порт Embedded Kafka
    consumer:
      group-id: analytics-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Отключаем отправку OTLP трейсов при прогоне тестов
management:
  otlp:
    tracing:
      endpoint: "http://localhost:4318/v1/traces"
  tracing:
    enabled: false